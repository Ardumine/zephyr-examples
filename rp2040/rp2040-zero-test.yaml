esphome:
  name: rp2040-zero-example

# RP2040 on Zephyr. Builds for the Waveshare RP2040-Zero board.
# Compile:  python3 -m esphome compile rp2040-zero-example.yaml
# Flash:    Put board in BOOTSEL mode, then:
#           picotool load -x .esphome/build/<name>/.west_build/zephyr/zephyr/zephyr.uf2
zephyr:
  variant: rp2040
  board: rp2040_zero
  log_level: INFO

logger:
